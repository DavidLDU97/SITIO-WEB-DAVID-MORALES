<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Batman en Realidad Aumentada</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{

background:linear-gradient(135deg,#000428,#004e92);

display:flex;
justify-content:center;
align-items:center;

height:100vh;

overflow:hidden;

}

.contenedor{

width:95%;
max-width:900px;

background:white;

border-radius:20px;

padding:20px;

box-shadow:0px 10px 40px rgba(0,0,0,.4);

text-align:center;

}

h1{

margin-bottom:15px;

color:#222;

}

p{

margin-bottom:20px;

color:#555;

font-size:18px;

}

model-viewer{

width:100%;

height:550px;

background:#f5f5f5;

border-radius:15px;

}

.boton{

margin-top:20px;

font-size:20px;

padding:15px 40px;

background:#1565C0;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

transition:.3s;

}

.boton:hover{

background:#0D47A1;

}

footer{

margin-top:20px;

font-size:14px;

color:#666;

}

</style>

</head>

<body>

<div class="contenedor">

<h1>Batman en Realidad Aumentada</h1>

<p>
Presiona el botón para visualizar el modelo 3D o verlo en Realidad Aumentada.
</p>

<model-viewer

id="visor"

src="Batman.glb"

ios-src="Batman.usdz"

poster=""

camera-controls

touch-action="pan-y"

shadow-intensity="1"

auto-rotate

ar

ar-modes="scene-viewer quick-look webxr"

environment-image="neutral"

exposure="1"

style="background:#f0f0f0;">

<button
slot="ar-button"
class="boton">

📱 Ver en Realidad Aumentada

</button>

</model-viewer>

<footer>

Creado por Profe David • Laboratorio Virtual de Matemáticas

</footer>

</div>

<script>

const visor=document.getElementById("visor");

visor.addEventListener("load",()=>{

console.log("Modelo cargado correctamente.");

});

visor.addEventListener("error",(e)=>{

alert("No se pudo cargar Batman.glb");

console.log(e);

});

</script>

</body>
</html>
